plugins {
    id 'com.android.application'
}

android {
    namespace 'com.kunpo.crack'
    compileSdk 34
    // 与 CI（.github/workflows/build.yml）安装的 NDK 保持一致
    ndkVersion '26.1.10909125'

    defaultConfig {
        applicationId "com.kunpo.crack"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        ndk {
            // 游戏只提供这两个 ABI：lib/arm64-v8a、lib/armeabi-v7a
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }

        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=none'
                cppFlags '-std=c++17'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    packaging {
        resources {
            excludes += ['META-INF/*.kotlin_module']
        }
        jniLibs {
            // 把 .so 解压出来：NativeBridge 的第 1 条加载路径
            // （ApplicationInfo.nativeLibraryDir + System.load）依赖它，
            // 否则 Android 10 以下拿不到可 load 的真实文件。
            useLegacyPackaging = true
        }
    }
}

dependencies {
    // Xposed API 82。优先用随仓库内置的 jar（app/libs/xposed-api-82.jar，Apache-2.0），
    // 这样 CI 不依赖 api.xposed.info（已不可直连）；jar 不存在时才回退到 maven 镜像。
    def localApi = file('libs/xposed-api-82.jar')
    if (localApi.exists()) {
        compileOnly files(localApi)
    } else {
        compileOnly 'de.robv.android.xposed:api:82'
    }
}
